<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Market Vision</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="background: #f4f8fd;">

  <!-- STANDARD HEADER -->
  <header class="header">
    <div class="container nav">
      <a class="brand" href="index.html">
        <img src="assets/logo/logo.png" class="brand-mark" alt="Logo">
        <span>Market Vision</span>
      </a>
      
      <div class="nav-actions">
        <!-- Cart Outside Menu -->
        <a href="#" class="cart-icon" id="cartIcon" title="View Cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge">0</span>
        </a>
        
        <!-- Hamburger Toggle -->
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <!-- Dropdown Menu -->
      <nav id="mobileMenu" class="mobile-menu">
        <div id="menuProfileContainer"></div>
        <div class="menu-divider"></div>
        <a href="index.html"><i class="fas fa-home" style="margin-right:8px;"></i> Home</a>
        <a href="products.html"><i class="fas fa-box" style="margin-right:8px;"></i> Products</a>
        <div class="menu-divider"></div>
        <div id="authMenuLinks" style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
           <a href="login.html"><i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> Login / Sign Up</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container" style="padding: 30px 0; min-height: 70vh;">
    
    <!-- Dynamic Back Button -->
    <a href="javascript:history.back()" style="display: inline-flex; align-items: center; margin-bottom: 20px; color: #1565c0; font-weight: 700; font-size: 14px; text-decoration: none; padding: 8px 15px; background: #fff; border-radius: 8px; border: 1px solid #dce6f1; transition: 0.2s;">
      <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Back
    </a>

    <!-- The product details, suggestions, and reviews will be injected here by JS -->
    <div id="productDetailContainer">
       <p class="muted">Loading product details...</p>
    </div>

  </main>

  <!-- STANDARD FOOTER -->
  <footer class="footer" style="background: #fff; margin-top: auto;">
    <div class="container footer-row">
      <span>&copy; <span id="year"></span> Market Vision. All Rights Reserved.</span>
      <span>Designed with care.</span>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/product-details.js"></script>
</body>
</html>
